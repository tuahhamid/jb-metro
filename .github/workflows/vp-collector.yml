# Collects BAS.MY Johor Bahru vehicle positions in weekday peak windows for
# validation test V3a (>= 3 weeks needed). Approved by the owner 2026-11-04.
#
# Budget while the repo is private (2,000 free min/month): Tue-Thu only,
# AM 07:00-08:00 and PM 17:30-18:30 Malaysia time (UTC+8), ~63 min per run,
# ~6 runs/week = ~1,650 min/month. After the repo is public, Actions minutes on
# standard runners are free and the schedule can widen to Mon-Fri.
# GitHub may start scheduled runs late; the real window is in each summary JSON.
#
# Output goes to the separate branch `vp-data` (one Parquet + JSON per window),
# keeping main's history small.
name: vp-collector

on:
  schedule:
    - cron: "0 23 * * 1-3"   # Tue-Thu 07:00 MYT
    - cron: "30 9 * * 2-4"   # Tue-Thu 17:30 MYT
  workflow_dispatch:
    inputs:
      minutes:
        description: "Collection length in minutes"
        type: number
        default: 3

permissions:
  contents: write

concurrency:
  group: vp-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-collector.txt

      - run: pip install -r pipeline/requirements-collector.txt

      - name: Collect
        env:
          MINUTES: ${{ inputs.minutes || 60 }}
          EVENT: ${{ github.event_name }}
        run: |
          STAMP=$(TZ=Asia/Kuala_Lumpur date +%Y-%m-%dT%H%M)
          echo "OUT=vp/$(TZ=Asia/Kuala_Lumpur date +%Y/%m/%d)/${STAMP}-myt-${EVENT}-${GITHUB_RUN_ID}.parquet" >> "$GITHUB_ENV"
          python pipeline/fetch/collect_vehicle_positions.py --minutes "$MINUTES" --interval 30 --out "$RUNNER_TEMP/out.parquet"

      - name: Commit to vp-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          if git fetch origin vp-data 2>/dev/null; then
            git checkout -B vp-data origin/vp-data
          else
            git checkout --orphan vp-data
            git rm -rf -q .
            printf "# vp-data\n\nBAS.MY Johor Bahru vehicle positions collected by .github/workflows/vp-collector.yml on main.\nSource: https://api.data.gov.my/gtfs-realtime/vehicle-position/mybas-johor (public, no key).\nOne Parquet + JSON summary per collection window. Times in file names are Malaysia time (UTC+8).\n" > README.md
            git add README.md
          fi
          mkdir -p "$(dirname "$OUT")"
          cp "$RUNNER_TEMP/out.parquet" "$OUT"
          cp "$RUNNER_TEMP/out.json" "${OUT%.parquet}.json"
          git add vp
          git commit -q -m "vp: ${OUT} [skip ci]"
          for i in 1 2 3 4; do
            if git push origin vp-data; then echo "pushed"; exit 0; fi
            sleep $((i*10)); git pull --rebase origin vp-data || true
          done
          echo "::error::push to vp-data failed after 4 attempts"; exit 1
