# Stage 2: alignment hypotheses (all output status = concept / inferred).
# Fetches the OSM study-area extract, Copernicus DEM, JRC flood tile and the JPBD plan list,
# then builds and screens the corridor options and runs the V4-alt pedestrian audit.
# Public, unauthenticated endpoints only; no access restriction is bypassed.
name: stage2-alignments

on:
  workflow_dispatch:
    inputs:
      refresh_osm:
        description: "Re-download the OSM extract even if a pinned study clip exists"
        type: boolean
        default: false
  push:
    branches: [main, "claude/**"]
    paths:
      - "pipeline/stage2/**"
      - "pipeline/requirements-stage2.txt"
      - ".github/workflows/stage2-alignments.yml"

permissions:
  contents: write

concurrency:
  group: stage2-alignments-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OSM_CLIP: data/raw/osm/jb-study.osm.pbf
      BBOX: "103.55,1.38,103.88,1.62"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-stage2.txt

      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements-stage2.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool poppler-utils

      - name: Get OSM extract and clip to the study area
        env:
          REFRESH_OSM: ${{ inputs.refresh_osm }}
        run: |
          mkdir -p data/raw/osm data/manifests
          if [ ! -f "$OSM_CLIP" ] || [ "$REFRESH_OSM" = "true" ]; then
            curl -sSfL -A "jb-metro-research/0.2" -o /tmp/msb.osm.pbf https://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf
            osmium extract -b "$BBOX" --strategy=complete_ways /tmp/msb.osm.pbf -o /tmp/study-all.osm.pbf --overwrite
            # keep only the layers Stage 2-3 use (roads/paths, rail, buildings, landuse, water, POIs)
            osmium tags-filter /tmp/study-all.osm.pbf \
              nwr/highway nwr/railway nwr/public_transport nwr/building nwr/landuse nwr/natural \
              w/waterway nwr/amenity nwr/shop nwr/place nwr/leisure nwr/entrance nwr/office nwr/tourism \
              -o "$OSM_CLIP" --overwrite
            {
              echo "{"
              echo "  \"source\": \"https://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf\","
              echo "  \"license\": \"ODbL 1.0, (c) OpenStreetMap contributors\","
              echo "  \"fetched_utc\": \"$(date -u +%FT%TZ)\","
              echo "  \"bbox_lonlat\": \"$BBOX\","
              echo "  \"filter\": \"highway railway public_transport building landuse natural waterway amenity shop place leisure entrance office tourism\","
              echo "  \"source_replication_timestamp\": \"$(osmium fileinfo -g header.option.osmosis_replication_timestamp /tmp/msb.osm.pbf)\","
              echo "  \"clip_bytes\": $(stat -c %s "$OSM_CLIP"),"
              echo "  \"clip_sha256\": \"$(sha256sum "$OSM_CLIP" | cut -d' ' -f1)\""
              echo "}"
            } > data/manifests/osm-study.json
            cat data/manifests/osm-study.json
          else
            echo "Using pinned clip $OSM_CLIP"
          fi

      - name: Fetch DEM, flood tile, plan list
        continue-on-error: true
        run: python pipeline/stage2/fetch_inputs.py --manifest data/manifests/stage2-inputs.json

      - name: Build and screen alignment options
        run: |
          GTFS=$(ls -d data/raw/gtfs/*/ | sort | tail -1)
          FLOOD=""; [ -f data/raw/flood/jrc-rp100-jb.tif ] && FLOOD="--flood data/raw/flood/jrc-rp100-jb.tif"
          mkdir -p results/stage2
          python pipeline/stage2/build_alignments.py --osm "$OSM_CLIP" --dem data/raw/dem/cop30-jb.tif $FLOOD \
            --gtfs "${GTFS}mybas-johor.zip" --ktmb "${GTFS}ktmb.zip" --options pipeline/stage2/options.json \
            2>&1 | tee results/stage2/build_log.txt

      - name: V4-alt pedestrian audit (Bukit Chagar)
        if: always()
        run: python pipeline/stage2/v4alt_audit.py --osm "$OSM_CLIP" --out results/stage2/v4alt_bukit_chagar.json 2>&1 | tee results/stage2/v4alt_log.txt

      - name: Write run metadata
        if: always()
        run: |
          cat > results/stage2/run_metadata.json <<EOM
          {"workflow": "stage2-alignments", "run_id": "${{ github.run_id }}", "run_attempt": "${{ github.run_attempt }}",
           "commit": "${{ github.sha }}", "ref": "${{ github.ref_name }}", "finished_utc": "$(date -u +%FT%TZ)",
           "runner": "ubuntu-24.04", "python": "$(python --version 2>&1)"}
          EOM

      - name: Upload outputs as artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage2-outputs-${{ github.run_id }}
          path: |
            results/stage2
            data/concept
            data/manifests
          retention-days: 90

      - name: Commit results back to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          # DEM and flood rasters are re-fetched each run and not committed (size; third-party license)
          if [ -f "$OSM_CLIP" ] && [ $(stat -c %s "$OSM_CLIP") -gt 47185920 ]; then echo "$OSM_CLIP" >> .git/info/exclude; fi
          git add results/stage2 data/concept data/manifests "$OSM_CLIP" || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "stage2-alignments: results from run ${{ github.run_id }} [skip ci]"
          for i in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "pushed"; exit 0; fi
            sleep $((i*10))
          done
          echo "::error::push failed after 4 attempts; outputs are in the uploaded artifact"; exit 1
