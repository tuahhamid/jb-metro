# Stage 1: prove the web-only data + r5py pipeline on a small Johor Bahru test.
# Runs on GitHub-hosted runners (free minutes for this account's plan; ~10 min/run).
# Fetches only public, unauthenticated endpoints. Commits manifests and results
# back to the branch so a Claude session (which cannot reach these hosts) can read them.
name: stage1-pipeline

on:
  workflow_dispatch:
    inputs:
      refresh_osm:
        description: "Re-download the OSM extract even if a pinned clip exists"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/stage1-pipeline.yml"
      - "docs/sources/source-register.csv"

permissions:
  contents: write

concurrency:
  group: stage1-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OSM_CLIP: data/raw/osm/jb-smoke.osm.pbf
      BBOX: "103.70,1.44,103.82,1.56"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Probe source register URLs (metadata only)
        continue-on-error: true
        run: python pipeline/fetch/probe_sources.py --register docs/sources/source-register.csv --out data/manifests/source-probe.csv

      - name: Fetch GTFS static (data.gov.my)
        continue-on-error: true
        run: python pipeline/fetch/fetch_gtfs.py --out data/raw/gtfs --manifest data/manifests/gtfs.json

      - name: Fetch one vehicle-position snapshot (data.gov.my)
        continue-on-error: true
        run: python pipeline/fetch/fetch_vehicle_positions.py --out results/stage1/vehicle_positions_snapshot.csv --summary results/stage1/vehicle_positions_summary.json

      - name: Get OSM extract and clip to smoke-test bbox
        continue-on-error: true
        run: |
          mkdir -p data/raw/osm
          if [ ! -f "$OSM_CLIP" ] || [ "${{ inputs.refresh_osm }}" = "true" ]; then
            curl -sSfL -A "jb-metro-research/0.1" -o /tmp/msb.osm.pbf https://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf
            osmium extract -b "$BBOX" /tmp/msb.osm.pbf -o "$OSM_CLIP" --overwrite
            {
              echo "{"
              echo "  \"source\": \"https://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf\","
              echo "  \"license\": \"ODbL 1.0, (c) OpenStreetMap contributors\","
              echo "  \"fetched_utc\": \"$(date -u +%FT%TZ)\","
              echo "  \"bbox_lonlat\": \"$BBOX\","
              echo "  \"source_replication_timestamp\": \"$(osmium fileinfo -g header.option.osmosis_replication_timestamp /tmp/msb.osm.pbf)\","
              echo "  \"clip_bytes\": $(stat -c %s "$OSM_CLIP"),"
              echo "  \"clip_sha256\": \"$(sha256sum "$OSM_CLIP" | cut -d' ' -f1)\""
              echo "}"
            } > data/manifests/osm-smoke.json
            cat data/manifests/osm-smoke.json
          else
            echo "Using pinned clip $OSM_CLIP"
          fi

      - name: Smoke test (r5py)
        continue-on-error: true
        run: |
          mkdir -p results/stage1
          GTFS=$(ls -d data/raw/gtfs/*/ 2>/dev/null | sort | tail -1)
          if [ -z "$GTFS" ] || [ ! -f "${GTFS}mybas-johor.zip" ] || [ ! -f "$OSM_CLIP" ]; then
            echo '{"all_pass": false, "tests": {"S1_network_builds": {"pass": false, "error": "inputs missing: GTFS or OSM fetch failed; see data/manifests"}}}' > results/stage1/smoke_report.json
            exit 1
          fi
          python pipeline/smoke/r5py_smoke_test.py --osm "$OSM_CLIP" --gtfs "$GTFS"mybas-johor.zip --out results/stage1 2>&1 | tee results/stage1/smoke_log.txt

      - name: Ridership bounds (arithmetic)
        if: always()
        run: python pipeline/analysis/rts_ridership_bounds.py --out results/stage1/rts_ridership_bounds.json

      - name: Write run metadata
        if: always()
        run: |
          cat > results/stage1/run_metadata.json <<EOF
          {"workflow": "stage1-pipeline", "run_id": "${{ github.run_id }}", "run_attempt": "${{ github.run_attempt }}",
           "commit": "${{ github.sha }}", "finished_utc": "$(date -u +%FT%TZ)",
           "runner": "ubuntu-24.04", "python": "$(python --version 2>&1)", "java": "$(java -version 2>&1 | head -1 | tr -d '"')"}
          EOF

      - name: Upload outputs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-outputs-${{ github.run_id }}
          path: |
            results/stage1
            data/manifests
          retention-days: 90

      - name: Commit results back to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          # Keep the repo small: commit the OSM clip only if < 25 MB
          if [ -f "$OSM_CLIP" ] && [ $(stat -c %s "$OSM_CLIP") -gt 26214400 ]; then echo "$OSM_CLIP" >> .git/info/exclude; fi
          git add results/stage1 data/manifests data/raw/gtfs data/raw/osm || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "stage1-pipeline: results from run ${{ github.run_id }} [skip ci]"
          for i in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "pushed"; exit 0; fi
            sleep $((i*10))
          done
          echo "::error::push failed after 4 attempts; outputs are in the uploaded artifact"; exit 1
