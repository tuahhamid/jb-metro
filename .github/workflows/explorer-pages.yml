# Publishes the explorer (site/) to GitHub Pages.
#
# MANUAL ONLY: there is no push, pull_request or schedule trigger. The owner runs it
# (Actions -> explorer-pages -> Run workflow) after approving the explorer in the
# single release review (design spec section 5.9). Every action is pinned to a full
# commit SHA (docs/security-review.md finding 9).
name: explorer-pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: explorer-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node --test site/tests/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
